<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photography Exposure Triangle Tuner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :focus-visible { outline: 3px solid #f97316; outline-offset: 2px; }
    input[type=range] { accent-color: #f97316; }
  </style>
</head>
<body class="bg-gray-900 min-h-screen text-white">
  <div class="max-w-4xl mx-auto px-4 py-8">
    <header class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-white">Exposure Triangle Tuner</h1>
      <p class="text-gray-400 mt-2">Adjust aperture, shutter speed, and ISO to find your perfect exposure.</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
      <!-- Controls -->
      <div class="bg-gray-800 rounded-xl p-6 space-y-6">
        <!-- Aperture -->
        <div>
          <div class="flex justify-between items-center mb-2">
            <label for="apertureSlider" class="font-semibold text-orange-300">Aperture</label>
            <span id="apertureDisplay" class="text-xl font-bold text-white font-mono"></span>
          </div>
          <input type="range" id="apertureSlider" min="0" max="10" step="1" value="3"
            class="w-full h-2 rounded-full" aria-label="Aperture" />
          <div class="flex justify-between text-xs text-gray-500 mt-1">
            <span>f/1.0 (wide)</span><span>f/22 (narrow)</span>
          </div>
          <div id="dofIndicator" class="mt-2 text-sm font-medium"></div>
        </div>

        <!-- Shutter Speed -->
        <div>
          <div class="flex justify-between items-center mb-2">
            <label for="shutterSlider" class="font-semibold text-sky-300">Shutter Speed</label>
            <span id="shutterDisplay" class="text-xl font-bold text-white font-mono"></span>
          </div>
          <input type="range" id="shutterSlider" min="0" max="17" step="1" value="7"
            class="w-full h-2 rounded-full" aria-label="Shutter speed" />
          <div class="flex justify-between text-xs text-gray-500 mt-1">
            <span>1/4000s (fast)</span><span>30s (slow)</span>
          </div>
        </div>

        <!-- ISO -->
        <div>
          <div class="flex justify-between items-center mb-2">
            <label for="isoSlider" class="font-semibold text-green-300">ISO</label>
            <span id="isoDisplay" class="text-xl font-bold text-white font-mono"></span>
          </div>
          <input type="range" id="isoSlider" min="0" max="10" step="1" value="0"
            class="w-full h-2 rounded-full" aria-label="ISO sensitivity" />
          <div class="flex justify-between text-xs text-gray-500 mt-1">
            <span>ISO 100 (clean)</span><span>ISO 102400 (noisy)</span>
          </div>
        </div>
      </div>

      <!-- EV Result + Triangle -->
      <div class="bg-gray-800 rounded-xl p-6 flex flex-col items-center">
        <div class="mb-4 text-center">
          <div class="text-gray-400 text-sm mb-1">Exposure Value (EV)</div>
          <div id="evValue" class="text-5xl font-bold text-orange-400 font-mono"></div>
          <div id="evLabel" class="text-gray-300 mt-2 text-lg font-medium"></div>
        </div>

        <!-- SVG Triangle -->
        <svg viewBox="0 0 200 180" class="w-48 h-auto" aria-label="Exposure triangle diagram" role="img">
          <defs>
            <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#f97316" stop-opacity="0.3"/>
              <stop offset="100%" stop-color="#f97316" stop-opacity="0.05"/>
            </linearGradient>
          </defs>
          <polygon points="100,10 190,165 10,165" fill="url(#tg)" stroke="#f97316" stroke-width="2"/>
          <text x="100" y="8" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="bold">ISO</text>
          <text id="triISO" x="100" y="25" text-anchor="middle" fill="white" font-size="10"></text>
          <text x="8" y="178" text-anchor="start" fill="#7dd3fc" font-size="11" font-weight="bold">Shutter</text>
          <text id="triShutter" x="8" y="160" text-anchor="start" fill="white" font-size="9"></text>
          <text x="192" y="178" text-anchor="end" fill="#fb923c" font-size="11" font-weight="bold">Aperture</text>
          <text id="triAperture" x="192" y="160" text-anchor="end" fill="white" font-size="9"></text>
          <circle id="triDot" cx="100" cy="95" r="5" fill="#f97316" opacity="0.8"/>
        </svg>
      </div>
    </div>

    <!-- Equivalent exposures -->
    <div class="bg-gray-800 rounded-xl p-6">
      <h2 class="text-lg font-semibold text-white mb-4">Equivalent Exposures (same EV)</h2>
      <div id="equivalents" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
    </div>
  </div>

  <script>
    const APERTURES = [1.0, 1.4, 2.0, 2.8, 4.0, 5.6, 8.0, 11, 16, 22, 32];
    const SHUTTERS = [
      { label: '1/4000', val: 1/4000 },
      { label: '1/2000', val: 1/2000 },
      { label: '1/1000', val: 1/1000 },
      { label: '1/500',  val: 1/500  },
      { label: '1/250',  val: 1/250  },
      { label: '1/125',  val: 1/125  },
      { label: '1/60',   val: 1/60   },
      { label: '1/30',   val: 1/30   },
      { label: '1/15',   val: 1/15   },
      { label: '1/8',    val: 1/8    },
      { label: '1/4',    val: 0.25   },
      { label: '1/2',    val: 0.5    },
      { label: '1"',     val: 1      },
      { label: '2"',     val: 2      },
      { label: '4"',     val: 4      },
      { label: '8"',     val: 8      },
      { label: '15"',    val: 15     },
      { label: '30"',    val: 30     },
    ];
    const ISOS = [100,200,400,800,1600,3200,6400,12800,25600,51200,102400];

    const EV_LABELS = [
      { max: -6,  label: 'Starlit night sky' },
      { max: -1,  label: 'Moonlit night' },
      { max: 2,   label: 'Night street scene' },
      { max: 5,   label: 'Indoor (dim)' },
      { max: 8,   label: 'Indoor (bright)' },
      { max: 10,  label: 'Overcast / cloudy' },
      { max: 12,  label: 'Hazy sunshine' },
      { max: 14,  label: 'Bright sun on sand' },
      { max: 16,  label: 'Sunny 16 rule' },
      { max: 999, label: 'Very bright / overexposed' },
    ];

    function calcEV(N, t, iso) {
      return Math.log2((N * N) / t) + Math.log2(iso / 100);
    }

    function getEvLabel(ev) {
      for (const e of EV_LABELS) if (ev <= e.max) return e.label;
      return '';
    }

    function getDOF(aIdx) {
      const N = APERTURES[aIdx];
      if (N <= 1.8)  return { label: 'Very Shallow DOF', color: 'text-red-400' };
      if (N <= 4)    return { label: 'Shallow DOF',      color: 'text-orange-400' };
      if (N <= 8)    return { label: 'Moderate DOF',     color: 'text-yellow-400' };
      if (N <= 16)   return { label: 'Deep DOF',         color: 'text-green-400' };
      return              { label: 'Very Deep DOF',      color: 'text-blue-400' };
    }

    function update() {
      const aIdx = parseInt(document.getElementById('apertureSlider').value);
      const sIdx = parseInt(document.getElementById('shutterSlider').value);
      const iIdx = parseInt(document.getElementById('isoSlider').value);

      const N = APERTURES[aIdx];
      const t = SHUTTERS[sIdx].val;
      const iso = ISOS[iIdx];
      const ev = calcEV(N, t, iso);

      document.getElementById('apertureDisplay').textContent = `f/${N}`;
      document.getElementById('shutterDisplay').textContent  = SHUTTERS[sIdx].label;
      document.getElementById('isoDisplay').textContent      = `ISO ${iso.toLocaleString()}`;
      document.getElementById('evValue').textContent         = ev.toFixed(1);
      document.getElementById('evLabel').textContent         = getEvLabel(ev);

      const dof = getDOF(aIdx);
      document.getElementById('dofIndicator').innerHTML =
        `<span class="${dof.color}">${dof.label}</span>`;

      // Triangle labels
      document.getElementById('triISO').textContent      = `ISO ${iso}`;
      document.getElementById('triShutter').textContent  = SHUTTERS[sIdx].label;
      document.getElementById('triAperture').textContent = `f/${N}`;

      // Equivalent exposures: keep EV same, vary combinations
      const equivDiv = document.getElementById('equivalents');
      const equivs = [];
      // Fix ISO, vary aperture and shutter
      for (let a = 0; a < APERTURES.length && equivs.length < 6; a++) {
        if (a === aIdx) continue;
        const Na = APERTURES[a];
        // Solve for t: ev = log2(Na^2/t) + log2(iso/100) => t = Na^2 / 2^(ev - log2(iso/100))
        const tTarget = (Na * Na) / Math.pow(2, ev - Math.log2(iso / 100));
        // Find closest shutter
        let bestS = 0, bestDiff = Infinity;
        for (let s = 0; s < SHUTTERS.length; s++) {
          const diff = Math.abs(Math.log2(SHUTTERS[s].val) - Math.log2(tTarget));
          if (diff < bestDiff) { bestDiff = diff; bestS = s; }
        }
        if (bestDiff < 0.6) {
          equivs.push({ aperture: Na, shutter: SHUTTERS[bestS], iso, evActual: calcEV(Na, SHUTTERS[bestS].val, iso) });
        }
      }
      equivDiv.innerHTML = equivs.length === 0
        ? '<p class="text-gray-500 text-sm col-span-3">No equivalent combinations found at this EV.</p>'
        : equivs.map(e => `
          <div class="bg-gray-700 rounded-lg px-4 py-3 text-sm flex flex-col gap-1">
            <div class="flex justify-between">
              <span class="text-orange-300">f/${e.aperture}</span>
              <span class="text-sky-300">${e.shutter.label}</span>
              <span class="text-green-300">ISO ${e.iso}</span>
            </div>
            <div class="text-gray-400 text-xs">EV ${e.evActual.toFixed(1)}</div>
          </div>`).join('');
    }

    ['apertureSlider','shutterSlider','isoSlider'].forEach(id => {
      document.getElementById(id).addEventListener('input', update);
    });

    update();
  </script>
</body>
</html>
